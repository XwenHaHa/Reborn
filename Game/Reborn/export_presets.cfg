; Reborn / Godot Windows 导出预设
;
; 由 agent 手写（纯文本）。Godot 对缺失的 option 键会回退到平台默认值，
; 因此只写我们**明确关心**的键，其余交给引擎默认。
;
; 依据 Docs/Tasks/Bootstrap.md T007。输出目录 Builds/ 已在 .gitignore 中排除。
;
; 两个预设的分工：
;   preset.0 "Windows Desktop"          —— 发布用，排除 tests/*
;   preset.1 "Windows Desktop SelfTest" —— 验证用，**包含** tests/*，
;       使打包产物自身可跑 run_t002.gd 断言，用来证明"包是完好的"。
;       这也让以后任何一次打包都能被程序化冒烟测试。

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; T062：候选版**移除测试作弊入口** —— 除 tests/* 外，调试入口（F1~F6 切物种/碰撞线框/导航路径/调试 HUD/重开）
; 与 debug 脚本一律不进发行包。SelfTest 预设仍保留（它要在包内跑 tests/* 断言）。
exclude_filter="tests/*,scripts/debug/*,scenes/debug/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; T043：发行版**不弹控制台**，只产出 GUI exe（预设.0 = 0）。
; SelfTest 保留控制台包装（预设.1 = 2），包内断言才能捕获 stdout。
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/product_name="Reborn"
application/company_name="Reborn"
application/file_description="轮生 Reborn — 双物种硬核生存切片"
application/copyright=""
application/product_version="0.0.1"
application/file_version="0.0.1"

[preset.1]

name="Windows Desktop SelfTest"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; 自检预设**保留** tests/*，以便在打包产物内运行断言
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/product_name="RebornSelfTest"
application/company_name="Reborn"
application/file_description="Reborn 打包自检（含 tests/*）"
application/copyright=""
application/product_version="0.0.1"
application/file_version="0.0.1"
