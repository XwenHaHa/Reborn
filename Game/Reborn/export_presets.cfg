; Reborn / Godot Windows 导出预设
;
; 由 agent 手写（纯文本）。Godot 对缺失的 option 键会回退到平台默认值，
; 因此只写我们**明确关心**的键，其余交给引擎默认。
;
; 依据 Docs/Tasks/Bootstrap.md T007。输出目录 Builds/ 已在 .gitignore 中排除。
;
; 两个预设的分工：
;   preset.0 "Windows Desktop"          —— 发布用，排除 tests/*
;   preset.1 "Windows Desktop SelfTest" —— 验证用，**包含** tests/*，
;       使打包产物自身可跑 run_t002.gd 断言，用来证明"包是完好的"。
;       这也让以后任何一次打包都能被程序化冒烟测试。

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; 生成带控制台的包装 exe，便于无人值守捕获运行期输出（T007 证据需要）。
; Godot 4.7 里这是枚举 No=0 / Debug Only=1 / Debug and Release=2。
; 写 1 时 release 导出**不会**生成 .console.exe（已实测踩到）。
debug/export_console_wrapper=2
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/product_name="Reborn"
application/company_name="Reborn"
application/file_description="轮生 Reborn — 双物种硬核生存切片"
application/copyright=""
application/product_version="0.0.1"
application/file_version="0.0.1"

[preset.1]

name="Windows Desktop SelfTest"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; 自检预设**保留** tests/*，以便在打包产物内运行断言
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/product_name="RebornSelfTest"
application/company_name="Reborn"
application/file_description="Reborn 打包自检（含 tests/*）"
application/copyright=""
application/product_version="0.0.1"
application/file_version="0.0.1"
